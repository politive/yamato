defaults:
  - domain: com.apple.dock
    key: autohide
    type: bool
    value: true
    comment: "Enabling auto-hide"

  - domain: com.apple.dock
    key: persistent-apps
    type: array
    value: []
    comment: "Removing pinned apps"

  - domain: com.apple.dock
    key: orientation
    type: string
    value: left
    comment: "Moving Dock to left side"

  - domain: com.apple.dock
    key: tilesize
    type: int
    value: 28
    comment: "Icon Size: 28px"

tools:
  - name: Git
    command: git
    check:
      type: path
      value: /opt/homebrew/bin/git

  - name: starship
    command: starship
    check:
      type: command
      value: starship
    symlinks:
      - source: "$YAMATO_PATH/cli/starship/starship.toml"
        target: "$HOME/.config/starship.toml"
