tools:
  - name: Git
    command: git
    check:
      type: path
      value: /opt/homebrew/bin/git

  - name: starship
    command: starship
    check:
      type: command
      value: starship
    symlinks:
      - source: "$YAMATO_PATH/cli/starship/starship.toml"
        target: "$HOME/.config/starship.toml"
