docker:
  # Use all_in_one for all-in-one solutions.
  # Uncomment one of the following blocks to use an all-in-one Docker solution.

  # all_in_one:
  #   cask: docker-desktop
  #   app: Docker.app

  # all_in_one:
  #   cask: rancher
  #   app: Rancher.app

  # all_in_one:
  #   cask: podman-desktop
  #   app: Podman Desktop.app

  # For custom setup, comment out the all_in_one line above and specify cli, daemon, and tui below.
  cli:
    - docker
    - docker-compose
  daemon:
    - colima
  tui:
    - lazydocker

terminal:
  # Specify the terminal emulator to use.
  # Options include: alacritty, iterm2, kitty, warp, wezterm
  emulator: wezterm

browser:
  # Specify the browser to use.
  - arc
  # - brave-browser
  # - firefox
  - google-chrome
  # - microsoft-edge
  # - opera
  # - vivaldi

desktop:
  brew_cask:
    # Google Chrome
    - cask: google-chrome
      app: Google Chrome.app

    # Slack
    - cask: slack
      app: Slack.app

    # Figma
    - cask: figma
      app: Figma.app

    # Spotify
    - cask: spotify
      app: Spotify.app

    # Microsoft Teams
    - cask: microsoft-teams
      app: Microsoft Teams.app
