defaults:
  - domain: com.apple.dock
    key: autohide
    type: bool
    value: true
    comment: "Enabling auto-hide"

  - domain: com.apple.dock
    key: persistent-apps
    type: array
    value: []
    comment: "Removing pinned apps"

  - domain: com.apple.dock
    key: orientation
    type: string
    value: left
    comment: "Moving Dock to left side"

  - domain: com.apple.dock
    key: tilesize
    type: int
    value: 28
    comment: "Icon Size: 28px"

tools:
  - command: docker

  - command: colima
    description: "container runtime"

  - command: git
    check:
      type: path
      value: /opt/homebrew/bin/git

  - command: wezterm
    description: "terminal"

  - command: editorconfig
    description: "editorconfig"

  - command: starship
    description: "prompt starship"

  - command: eza
    description: "eza"

  # postgresql client library
  - command: libpq
    check:
      type: command
      value: pg_config

  - command: libyaml
    check:
      type: path
      value: /opt/homebrew/include/yaml.h

  - command: mise

  - command: kimigayo
    tap: politive/kimigayo

  - command: zsh
    check:
      type: path
      value: /opt/homebrew/bin/zsh

  # VSCode
  - command: visual-studio-code
    cask: true
    check:
      type: command
      value: code

# custom symlinks
symlinks:
