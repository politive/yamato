defaults:
  - domain: com.apple.dock
    key: autohide
    type: bool
    value: true
    comment: "Enabling auto-hide"

  - domain: com.apple.dock
    key: persistent-apps
    type: array
    value: []
    comment: "Removing pinned apps"

  - domain: com.apple.dock
    key: orientation
    type: string
    value: left
    comment: "Moving Dock to left side"

  - domain: com.apple.dock
    key: tilesize
    type: int
    value: 28
    comment: "Icon Size: 28px"

tools:
  - command: docker

  - command: docker-compose
    copies:
      - source: "$YAMATO_D_PATH/dotfiles/.docker/config.json"
        target: "$HOME/.docker/config.json"
        force: true

  - command: git
    check:
      type: path
      value: /opt/homebrew/bin/git

  - command: wezterm
    symlinks:
      - source: $YAMATO_D_PATH/tools/wezterm/wezterm.lua
        target: $HOME/.config/wezterm/wezterm.lua

  - command: starship
    symlinks:
      - source: $YAMATO_D_PATH/tools/starship/starship.toml
        target: $HOME/.config/starship.toml

  - command: eza

  # postgresql client library
  - command: libpq
    check:
      type: command
      value: pg_config

  - command: libyaml
    check:
      type: path
      value: /opt/homebrew/include/yaml.h

  - command: mise

  - command: kimigayo
    tap: politive/kimigayo

  - command: zsh
    check:
      type: path
      value: /opt/homebrew/bin/zsh
    hooks:
      post: $YAMATO_D_PATH/tools/zsh/install.sh
    symlinks:
      - source: "$YAMATO_D_PATH/dotfiles/.zshrc"
        target: "$HOME/.zshrc"

  # VSCode
  - command: visual-studio-code
    cask: true
    check:
      type: command
      value: code
    symlinks:
      - source: $YAMATO_D_PATH/tools/vscode/settings.json
        target: $HOME/Library/Application Support/Code/User/settings.json

# custom symlinks
symlinks:
  - source: "$YAMATO_D_PATH/dotfiles/.zshrc"
    target: "$HOME/.zshrc"

  - source: "$YAMATO_D_PATH/dotfiles/.zshenv"
    target: "$HOME/.zshenv"

  - source: "$YAMATO_D_PATH/dotfiles/.zprofile"
    target: "$HOME/.zprofile"

  - source: "$YAMATO_D_PATH/dotfiles/.editorconfig"
    target: "$HOME/.editorconfig"
